[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "starfield"
version = "0.1.0"
description = "Deploy tool: push folders to GitHub repos and/or GCS buckets, then verify and list mirror links."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
starfield = "starfield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
